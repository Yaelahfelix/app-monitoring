# Contoh: taruh file ini di repo klien sebagai
# .github/workflows/security-scan.yml
name: Security Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # tiap Senin jam 03:00 UTC

jobs:
  security-scan:
    uses: Yaelahfelix/app-monitoring/.github/workflows/reusable-security-scan.yml@main
    with:
      client: "pdam-kota-a" # ganti sesuai nama klien
    secrets:
      dashboard_url: ${{ secrets.SECURITY_DASHBOARD_URL }}
      ingest_token: ${{ secrets.SECURITY_INGEST_TOKEN }}
      protection_bypass: ${{ secrets.SECURITY_PROTECTION_BYPASS }} # kalau dashboard pakai domain *.vercel.app bawaan
